name: Publish APT repository

# Ez a workflow NEM buildel újra .deb-et - a build-deb.yml sikeres
# lefutása után indul, és onnan tölti le a már elkészült artifact-ot.
# Így a letöltési link (Actions artifact) és az APT repo mindig
# ugyanabból a build-ből származik, nem eshetnek szét egymástól.
on:
  workflow_run:
    workflows: ["Build DEB package"]
    types:
      - completed
    branches:
      - main
      - preview
  workflow_dispatch:
    inputs:
      channel:
        description: "Melyik csatorna artifact-ját publikáljuk (workflow_dispatch esetén kötelező)"
        required: true
        type: choice
        options:
          - main
          - preview

permissions:
  contents: write
  actions: read

jobs:
  publish-apt-repo:
    runs-on: ubuntu-latest
    # workflow_run esetén csak akkor fusson, ha a build-deb.yml sikeres volt.
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # workflow_run esetén a triggerelő futás commitját nézzük, hogy a
          # packaging/apt/ kulcs- és sablon-fájlok is onnan legyenek.
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Determine build channel
        id: channel
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            CHANNEL="${{ inputs.channel }}"
          else
            CHANNEL="${{ github.event.workflow_run.head_branch }}"
          fi

          if [ "$CHANNEL" != "main" ] && [ "$CHANNEL" != "preview" ]; then
            echo "Ismeretlen/nem támogatott csatorna: $CHANNEL"
            exit 1
          fi

          if [ "$CHANNEL" = "main" ]; then
            PACKAGE_NAME="tervezo"
            SUITE="stable"
          else
            PACKAGE_NAME="tervezo-preview"
            SUITE="preview"
          fi

          echo "channel=$CHANNEL" >> "$GITHUB_OUTPUT"
          echo "package_name=$PACKAGE_NAME" >> "$GITHUB_OUTPUT"
          echo "suite=$SUITE" >> "$GITHUB_OUTPUT"

      - name: Install repository build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y dpkg-dev gzip coreutils gnupg

      - name: Download deb artifact from build-deb.yml
        uses: actions/download-artifact@v4
        with:
          name: tervezo-deb-${{ steps.channel.outputs.channel }}
          path: downloaded-deb
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ github.event.workflow_run.id || '' }}

      - name: Create APT repository structure
        env:
          PACKAGE_NAME: ${{ steps.channel.outputs.package_name }}
          SUITE: ${{ steps.channel.outputs.suite }}
        run: |
          set -e

          REPO_DIR="apt-repo"
          POOL_DIR="$REPO_DIR/pool/main/t/$PACKAGE_NAME"
          DIST_DIR="$REPO_DIR/dists/$SUITE"
          BINARY_DIR="$DIST_DIR/main/binary-all"

          DEB_FILE="$(find downloaded-deb -type f -name '*.deb' -print -quit)"

          if [ -z "$DEB_FILE" ]; then
            echo "Nem található .deb fájl a letöltött artifact-ban."
            exit 1
          fi

          mkdir -p "$POOL_DIR"
          mkdir -p "$BINARY_DIR"

          cp packaging/apt/tervezo-archive-keyring.gpg "$REPO_DIR/"

          cp "$DEB_FILE" "$POOL_DIR/"

          cd "$REPO_DIR"

          echo "==> Packages index generálása ($SUITE)"
          dpkg-scanpackages --arch all "pool" /dev/null > "dists/$SUITE/main/binary-all/Packages"

          echo "==> Packages.gz generálása"
          gzip -9 -k -f "dists/$SUITE/main/binary-all/Packages"

          cd "dists/$SUITE"

          echo "==> Release fájl létrehozása"
            {
              printf '%s\n' "Origin: Tervezo"
              printf '%s\n' "Label: Tervezo"
              printf '%s\n' "Suite: $SUITE"
              printf '%s\n' "Codename: $SUITE"
              printf '%s\n' "Architectures: all"
              printf '%s\n' "Components: main"
              printf '%s\n' "Description: APT repository for Tervezo ($SUITE)"
              printf '%s\n' "Date: $(date -Ru)"
            } > Release

          echo "MD5Sum:" >> Release
          for file in main/binary-all/Packages main/binary-all/Packages.gz; do
            printf " %s %16s %s\n" "$(md5sum "$file" | cut -d' ' -f1)" "$(stat -c%s "$file")" "$file" >> Release
          done

          echo "SHA1:" >> Release
          for file in main/binary-all/Packages main/binary-all/Packages.gz; do
            printf " %s %16s %s\n" "$(sha1sum "$file" | cut -d' ' -f1)" "$(stat -c%s "$file")" "$file" >> Release
          done

          echo "SHA256:" >> Release
          for file in main/binary-all/Packages main/binary-all/Packages.gz; do
            printf " %s %16s %s\n" "$(sha256sum "$file" | cut -d' ' -f1)" "$(stat -c%s "$file")" "$file" >> Release
          done

      - name: Import GPG signing key
        env:
          APT_GPG_PRIVATE_KEY: ${{ secrets.APT_GPG_PRIVATE_KEY }}
        run: |
          set -e
          mkdir -p ~/.gnupg
          chmod 700 ~/.gnupg
          echo "$APT_GPG_PRIVATE_KEY" | gpg --batch --import
          gpg --list-secret-keys --keyid-format=long

      - name: Sign APT repository
        env:
          APT_GPG_PASSPHRASE: ${{ secrets.APT_GPG_PASSPHRASE }}
          SUITE: ${{ steps.channel.outputs.suite }}
        run: |
          set -e
          cd "apt-repo/dists/$SUITE"

          GPG_KEY_ID="$(gpg --list-secret-keys --keyid-format=long | awk '/sec/{print $2}' | cut -d'/' -f2 | head -n1)"

          echo "Using GPG key: $GPG_KEY_ID"

          gpg --batch --yes \
            --pinentry-mode loopback \
            --passphrase "$APT_GPG_PASSPHRASE" \
            --default-key "$GPG_KEY_ID" \
            --clearsign \
            --output InRelease \
            Release

          gpg --batch --yes \
            --pinentry-mode loopback \
            --passphrase "$APT_GPG_PASSPHRASE" \
            --default-key "$GPG_KEY_ID" \
            --detach-sign \
            --armor \
            --output Release.gpg \
            Release

      - name: Deploy APT repository to gh-pages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PACKAGE_NAME: ${{ steps.channel.outputs.package_name }}
          SUITE: ${{ steps.channel.outputs.suite }}
        run: |
          set -e

          REMOTE_URL="https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"

          rm -rf gh-pages

          if git ls-remote --exit-code --heads "$REMOTE_URL" gh-pages >/dev/null 2>&1; then
            git clone --branch gh-pages --single-branch "$REMOTE_URL" gh-pages
          else
            mkdir gh-pages
            cd gh-pages
            git init
            git checkout -b gh-pages
            cd ..
          fi

          cd gh-pages

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git remote set-url origin "$REMOTE_URL" 2>/dev/null || git remote add origin "$REMOTE_URL"

          touch .nojekyll

          cd ..

          # Csak a JELENLEGI csatorna suite-ját és pool-mappáját cseréljük le -
          # a másik csatorna (pl. stable, ha most preview-t publikálunk)
          # változatlanul megmarad a gh-pages-en.
          rm -rf "gh-pages/dists/$SUITE"
          rm -rf "gh-pages/pool/main/t/$PACKAGE_NAME"

          rsync -a apt-repo/ gh-pages/

          cd gh-pages

          git add -A

          if git diff --cached --quiet; then
            echo "Nincs publikálandó változás."
          else
            git commit -m "Publish APT repository: $SUITE"
            git push origin gh-pages
          fi
