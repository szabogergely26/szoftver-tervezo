name: Build DEB package

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-deb:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y dpkg-dev fakeroot rsync desktop-file-utils

      - name: Make build script executable
        run: |
          chmod +x packaging/deb/build_deb.sh

      - name: Build deb package
        run: |
          ./packaging/deb/build_deb.sh

      - name: Collect deb artifact
        run: |
          mkdir -p artifacts
          find . -type f -name "*.deb" -print -exec cp {} artifacts/ \;
          test -n "$(find artifacts -type f -name '*.deb' -print -quit)"

      - name: Upload deb artifact
        uses: actions/upload-artifact@v4
        with:
          name: tervezo-deb
          path: artifacts/*.deb

      - name: Prepare release file (fixed name, no version)
        run: |
          cp "$(find artifacts -maxdepth 1 -type f -name '*.deb' -print -quit)" artifacts/Szoftver-tervezo.deb

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: "Legfrissebb build"
          files: artifacts/Szoftver-tervezo.deb
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}